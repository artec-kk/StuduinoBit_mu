# Builds the native macOS application for Mu.
#
# Apple is dropping Rosetta support, so we need a native arm64 (Apple Silicon)
# build in addition to the historical Intel (x86_64) one. arm64 binaries can
# only be produced on an Apple Silicon runner, hence the `macos-14` runner;
# the Intel build keeps running on `macos-13`.
name: macOS build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.arch }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (arm64) native build.
          - os: macos-14
            arch: arm64
          # Intel (x86_64) build, kept for backwards compatibility.
          - os: macos-13
            arch: x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Report architecture
        run: |
          uname -a
          python -c "import platform; print(platform.machine())"

      - name: Install Mu and its dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install .[dev]

      - name: Package Mu into a native macOS application
        run: make macos

      - name: Verify the application architecture
        run: |
          APP_BIN="macOS/mu-editor.app/Contents/MacOS/mu-editor"
          file "$APP_BIN" || true
          lipo -info "$APP_BIN" || true

      - name: Create the distributable archive
        run: |
          mkdir -p dist
          zip -r -X "dist/mu-editor-${{ matrix.arch }}.zip" macOS/mu-editor.app

      - name: Upload the build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mu-editor-${{ matrix.arch }}
          path: dist/mu-editor-${{ matrix.arch }}.zip
